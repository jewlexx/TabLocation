name: CI with Gradle

on:
  push:
    branches: [ "public" ]
  pull_request:
    branches: [ "public" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Build with Gradle
      run: ./gradlew build

